name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests (also checks every route is in openapi.yaml)
        env:
          CONTRACT_STRICT: "1"
        run: pytest -v

      - name: Static security scan (Bandit)
        run: bandit -r app -ll

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: API fuzzing against openapi.yaml (Schemathesis)
        run: |
          flask --app app run --port 5001 &
          sleep 5
          schemathesis run openapi.yaml --base-url http://127.0.0.1:5001 --checks all
