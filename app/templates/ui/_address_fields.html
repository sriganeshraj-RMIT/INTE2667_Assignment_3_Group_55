<div class="row g-2">
  <div class="col-12"><label class="form-label" for="{{ p }}address_line">Street address</label>
    <input class="form-control" id="{{ p }}address_line" name="address_line" maxlength="200" required></div>
  <div class="col-md-8"><label class="form-label" for="{{ p }}suburb">Suburb</label>
    <input class="form-control" id="{{ p }}suburb" name="suburb" maxlength="100" required></div>
  <div class="col-md-4"><label class="form-label" for="{{ p }}postcode">Postcode</label>
    <input class="form-control" id="{{ p }}postcode" name="postcode" pattern="\d{4}" maxlength="4" required></div>
</div>
