# R16 - hot standby. This file ADDS to docker-compose.yml (it does not change it).
#
#   docker compose -f docker-compose.yml -f docker-compose.failover.yml up --build
#
# Then use http://localhost:5002 (through nginx). The original http://localhost:5001 still goes straight to `app`.
services:
  app-standby:                    # a second copy of the app, always running, same image and same database
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
      - mailhog
    volumes:
      - .:/app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5002:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - app-standby
