services:
  app:
    build: .
    ports:
      - "5001:5000"
    env_file: .env
    depends_on:
      - db
      - redis
      - mailhog
    volumes:
      - .:/app

  monitor:                        # R11: watches the activity log and raises security alerts all the time
    build: .
    env_file: .env
    command: flask audit monitor
    restart: unless-stopped         # keeps retrying until MySQL is ready
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: identity_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
