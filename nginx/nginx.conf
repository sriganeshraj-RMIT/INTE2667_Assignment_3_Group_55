# R16 - Automatic failover (hot standby).
#
# Nginx sits in front of two copies of the same app. Normal traffic goes to `app`.
# The second copy, `app-standby`, is already running and shares the same database, but it is marked `backup`:
# nginx only uses it when `app` stops answering. If a request to `app` fails, nginx tries the standby for
# that same request, so the user sees at most a short pause, not an error.
upstream evp_app {
    server app:5000 max_fails=1 fail_timeout=5s;
    server app-standby:5000 backup;
}

server {
    listen 80;

    location / {
        proxy_pass http://evp_app;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows which copy answered (handy for the demo): look at this header with curl -i
        add_header X-Upstream $upstream_addr always;
    }
}
